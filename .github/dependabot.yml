version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins and their version comments
  # current. npm dependencies are updated by hand (npm 12 install-script approvals, see CLAUDE.md).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore
