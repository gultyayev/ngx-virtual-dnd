name: PR Quality Checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Lint, Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      # The default ref is the merge commit this run was triggered for (github.sha), so the
      # build and E2E jobs test the same code even if the PR moves while they run.
      - name: Checkout PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      # CI uses the npm pinned in package.json (packageManager), not the one bundled with Node.
      - name: Use pinned npm
        run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Angular Library
        run: npm run build:lib

      # Specs, E2E tests and the perf tooling are not part of any build, so nothing else
      # type-checks them. After the library build: the app specs import ngx-virtual-dnd from dist.
      - name: Type-check tests
        run: npm run typecheck

      # Built with the GitHub Pages base href so the assemble step below can reuse it. The E2E
      # jobs serve this same production build (scripts/serve-dist.js swaps the base href).
      - name: Build Angular App
        run: npm run build:demo:pages

      - name: Run unit tests
        run: npm test -- --silent

      # Share the built library and demo so E2E jobs serve the production demo without
      # rebuilding it 5x.
      - name: Upload built library and demo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-build
          path: dist/
          retention-days: 1

      # After the upload so the E2E artifact holds only the library and demo. docs:build
      # type-checks the docs theme and fails on dead links; the assemble step validates the
      # Pages layout.
      - name: Build docs site
        run: npm run docs:build

      - name: Assemble GitHub Pages site
        run: node scripts/assemble-site.js

  e2e:
    name: E2E (${{ matrix.project }})
    needs: build-and-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Full browser matrix on PRs — one job per Playwright project, parallelized to keep
      # wall time acceptable. Matches CLAUDE.md rule 3 (all-browsers run before done) and
      # guards against the browser-specific regressions this repo has a history of
      # (see .claude/history/safari-autoscroll.md). Each job installs only its own engine.
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: chromium-mobile
            browser: chromium
          - project: webkit-mobile
            browser: webkit
    steps:
      # The default ref is the merge commit this run was triggered for (github.sha), so the
      # build and E2E jobs test the same code even if the PR moves while they run.
      - name: Checkout PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      # CI uses the npm pinned in package.json (packageManager), not the one bundled with Node.
      - name: Use pinned npm
        run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"

      - name: Install dependencies
        run: npm ci

      # playwright.config.ts serves dist/dnd/browser (production build) when CI is set.
      - name: Download built library and demo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-build
          path: dist/

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # retries: 2 in playwright.config.ts absorb genuine browser variance. Passed-on-retry
      # (flaky) tests do NOT fail the job — they are surfaced in the job summary below so they
      # stay visible without blocking (issue #40 acceptance). Genuine failures (every attempt
      # fails) still fail the job. The github reporter annotates real failures inline in the PR.
      - name: Run E2E tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
        run: npx playwright test --reporter=dot,github,json --project=${{ matrix.project }}

      # Make flaky (passed-on-retry) tests visible in the CI summary instead of hiding them.
      - name: Surface flaky tests in job summary
        if: always()
        run: |
          report="playwright-report.json"
          [ -f "$report" ] || exit 0
          flaky=$(node -e '
            const r = require("./" + process.argv[1]);
            const out = [];
            const walk = (s) => {
              for (const spec of (s.specs || [])) {
                for (const t of (spec.tests || [])) {
                  if (t.status === "flaky") out.push((spec.file || "") + " › " + spec.title);
                }
              }
              for (const c of (s.suites || [])) walk(c);
            };
            for (const s of (r.suites || [])) walk(s);
            console.log([...new Set(out)].join("\n"));
          ' "$report")
          if [ -n "$flaky" ]; then
            {
              echo "### ⚠️ Flaky tests on ${{ matrix.project }} (passed on retry)"
              echo ""
              echo '```'
              echo "$flaky"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Single, stable required-status context that aggregates the build/unit job and the whole
  # E2E matrix. Keeping the job id `quality-checks` (no `name:` override) preserves the check
  # name branch protection already knows, while `if: always()` guarantees the context is
  # always reported — so it never gets stuck in "Expected — Waiting for status to be reported".
  quality-checks:
    needs: [build-and-unit, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required checks
        run: |
          echo "build-and-unit: ${{ needs.build-and-unit.result }}"
          echo "e2e:            ${{ needs.e2e.result }}"
          if [ "${{ needs.build-and-unit.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::One or more required checks did not succeed."
            exit 1
          fi
          echo "All quality checks passed."
