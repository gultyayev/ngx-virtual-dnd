name: Performance Benchmarks

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - '.claude/**'
      - '.ai/**'
      - 'skills/**'
  schedule:
    # Accumulate A/A evidence across fresh hosts and weekly image updates.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      blocks:
        description: Balanced blocks (10 gives a finite simultaneous interval)
        type: string
        default: '10'
      control:
        description: Calibration control
        type: choice
        options: [none, script, cpu]
        default: none

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
          npm ci
      - run: npm run perf:test

  benchmark:
    needs: harness-unit-tests
    runs-on: ubuntu-24.04
    # Forty sequential suites include warmups; contention controls can take longer.
    timeout-minutes: 120
    steps:
      - name: Checkout candidate and common harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: head
          persist-credentials: false
      - name: Checkout library baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: head/package-lock.json
      - name: Prepare a common consumer fixture and dependency lockfile
        working-directory: head
        run: npm run perf:prepare -- --base ../base
      - name: Install identical pinned dependencies
        run: |
          npm install -g "$(node -p "require('./head/package.json').packageManager.split('+')[0]")"
          npm ci --prefix base
          npm ci --prefix head
      - name: Install the common browser
        working-directory: head
        run: npx playwright install --with-deps chromium
      - name: Build and fingerprint baseline
        working-directory: base
        run: npm run perf:build
      - name: Build and fingerprint candidate
        working-directory: head
        run: npm run perf:build
      - name: Measure balanced blocks
        id: measure
        working-directory: head
        env:
          PERF_BLOCKS: ${{ inputs.blocks || '10' }}
          PERF_CALIBRATION: ${{ github.event_name != 'pull_request' }}
          PERF_CONTROL: ${{ inputs.control || 'none' }}
        run: |
          args=(--base ../base --head . --blocks "$PERF_BLOCKS")
          if [ "$PERF_CALIBRATION" = true ]; then
            args+=(--calibration --control "$PERF_CONTROL")
          fi
          set +e
          npm run --silent perf:ab -- "${args[@]}"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report measurements and verdict
        if: always()
        working-directory: head
        run: |
          if [ -f perf/results/experiment.json ]; then
            npm run --silent perf:report -- --input perf/results/experiment.json --output perf/results/report.md || true
            npm run --silent perf:report -- --input perf/results/experiment.json --details --output perf/results/report-details.md > /dev/null || true
            cat perf/results/report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f perf/results/comparison.json ]; then
            npm run --silent perf:report -- --input perf/results/comparison.json --output perf/results/report.md || true
            npm run --silent perf:report -- --input perf/results/comparison.json --details --output perf/results/report-details.md > /dev/null || true
            cat perf/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { readFileSync, existsSync } = require('fs');
            let report = 'Benchmark setup failed; see workflow logs.';
            if (existsSync('head/perf/results/report.md')) {
              report = readFileSync('head/perf/results/report.md', 'utf8');
            } else if (existsSync('head/perf/results/comparison.md')) {
              report = readFileSync('head/perf/results/comparison.md', 'utf8');
            }
            const marker = '<!-- perf-benchmark-results -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${report}\n\n[Full measurements and runner diagnostics](${run}#artifacts) · [Workflow logs](${run})\n\nTiming is advisory during calibration; invalid measurements fail CI.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - name: Upload raw evidence and calibration
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-results-${{ github.run_attempt }}
          path: head/perf/results/
          retention-days: 90
      - name: Enforce measurement integrity
        if: always()
        env:
          PERF_STATUS: ${{ steps.measure.outputs.status }}
        run: |
          case "$PERF_STATUS" in
            0) echo "Valid performance pass." ;;
            1) echo "::warning::Performance regression evidence; timing gate remains advisory during calibration." ;;
            2) echo "::warning::Inconclusive performance evidence; this is not a performance pass." ;;
            *) echo "::error::Invalid or incomplete benchmark evidence. See logs and artifacts."; exit 1 ;;
          esac
