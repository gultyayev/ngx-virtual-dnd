name: PR Title

# Separate from pr-checks.yml so a title edit re-validates only the title. If the edit
# re-ran pr-checks instead, it would report the code checks green without running them.
# `synchronize` reports this check again on each new head commit.
on:
  pull_request:
    branches: [master]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # CI uses the npm pinned in package.json (packageManager), not the one bundled with Node.
      - name: Use pinned npm
        run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"

      - name: Install dependencies
        run: npm ci

      # Through env, never interpolated into the script: the title is user input.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint
