name: Deploy to GitHub Pages

# Publishes one site: the Rspress docs at /ngx-virtual-dnd/ and the Angular demo at
# /ngx-virtual-dnd/demo/ (assembled by scripts/assemble-site.js).
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'projects/**'
      - 'docs/**'
      - 'scripts/assemble-site.js'
      - 'CHANGELOG.md'
      - angular.json
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Library → demo (base href /ngx-virtual-dnd/demo/) → docs → assemble into dist/site
      - name: Build site
        run: npm run site:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
