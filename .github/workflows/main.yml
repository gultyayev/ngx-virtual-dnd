name: Deploy to GitHub Pages

# Publishes one site: the Rspress docs at /ngx-virtual-dnd/ and the Angular demo at
# /ngx-virtual-dnd/demo/ (assembled by scripts/assemble-site.js).
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'projects/**'
      - 'docs/**'
      - 'scripts/assemble-site.js'
      - 'tsconfig*.json'
      - '.github/workflows/main.yml'
      - 'CHANGELOG.md'
      - angular.json
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue instead of cancelling: a cancelled run can stop a deploy halfway. A queued run
# still deploys the latest push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      # CI uses the npm pinned in package.json (packageManager), not the one bundled with Node.
      - name: Use pinned npm
        run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"

      - name: Install dependencies
        run: npm ci

      # Library → demo (base href /ngx-virtual-dnd/demo/) → docs → assemble into dist/site
      - name: Build site
        run: npm run site:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
